<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Canvas Background (Optional: Remove if you need a transparent logo) -->
  <rect width="400" height="400" rx="40" fill="#0f172a"/>

  <g transform="translate(40, 30)" filter="url(#subtleGlow)">
    <!-- Outer Shield / Container: DevSecOps Boundary -->
    <path 
      d="M 160 40 
         L 260 80 
         C 260 190, 210 270, 160 300 
         C 110 270, 60 190, 60 80 
         Z" 
      fill="none" 
      stroke="url(#brandGrad)" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Code Tag '<' : Front-End Element -->
    <path 
      d="M 135 125 
         L 95 165 
         L 135 205" 
      fill="none" 
      stroke="#8b5cf6" 
      stroke-width="12" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Security Core / Pipeline Sentry Node -->
    <circle cx="185" cy="165" r="16" fill="#06b6d4"/>
    
    <!-- Protective Node Orbit / CI/CD Arc -->
    <path 
      d="M 185 130 
         A 35 35 0 0 1 220 165 
         A 35 35 0 0 1 185 200" 
      fill="none" 
      stroke="#06b6d4" 
      stroke-width="8" 
      stroke-linecap="round" 
      stroke-dasharray="8 6"
    />
  </g>
</svg>
